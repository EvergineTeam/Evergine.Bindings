name: Binding XML CD (Reusable)

description: >
  Reusable workflow for publishing NuGets for bindings that require XML download and comparison.

on:
  workflow_call:
    inputs:
      xml-url:
        description: 'URL to download the XML definition file (e.g., vk.xml, xr.xml)'
        required: true
        type: string
      xml-path:
        description: 'Local path to store the XML file (e.g., vk.xml, xr.xml, KhronosRegistry/xr.xml)'
        required: true
        type: string
      generator-project:
        description: 'Path to the generator .csproj file'
        required: true
        type: string
      generator-name:
        description: 'Name of the generator/binding'
        required: true
        type: string
      binding-project:
        description: 'Path to the binding .csproj file'
        required: true
        type: string
      dependency-projects:
        description: 'Comma-separated list of .csproj paths that need to be built first (dependencies) but won''t generate NuGet packages'
        required: false
        type: string
        default: ''
      target-framework:
        description: 'Target framework for the binding'
        required: false
        type: string
        default: 'net8.0'
      dotnet-version:
        description: 'Version of .NET SDK to use (e.g., 8.x)'
        required: false
        type: string
        default: '8.x'
      nuget-version:
        description: 'Version of NuGet CLI to use (e.g., 6.x)'
        required: false
        type: string
        default: '6.x'
      nuget-source:
        description: 'NuGet source for publishing packages'
        required: false
        type: string
        default: 'https://api.nuget.org/v3/index.json'
      runtime-identifier:
        description: 'Runtime identifier (optional, for platform-specific bindings)'
        required: false
        type: string
        default: 'win-x64'
      build-verbosity:
        description: 'dotnet verbosity level'
        required: false
        type: string
        default: 'normal'
      build-configuration:
        description: 'Build configuration (Release, Debug, etc.)'
        required: false
        type: string
        default: 'Release'
      restore-workloads:
        description: 'Restore .NET workloads for projects before packaging'
        required: false
        type: boolean
        default: false
      version:
        description: 'Direct version string to use for packages (e.g., "3.4.22.288-local")'
        required: false
        type: string
        default: ''
      revision:
        description: 'Revision number to append to date-based version (e.g., "123" -> "2025.10.29.123"). Cannot be used with version.'
        required: false
        type: string
        default: ''
      output-folder:
        description: 'Base folder for NuGet package output'
        required: false
        type: string
        default: 'nupkgs'
      include-symbols:
        description: 'Whether to include debug symbols in packages'
        required: false
        type: boolean
        default: false
      symbols-format:
        description: 'Symbol package format: snupkg (modern) or symbols.nupkg (legacy)'
        required: false
        type: string
        default: 'snupkg'
      bindings-script-path:
        description: 'Path to the Generate-Bindings-DotNet.ps1 script'
        required: false
        type: string
        default: 'build/scripts/Generate-Bindings-DotNet.ps1'
      nugets-script-path:
        description: 'Path to the Generate-NuGets-DotNet.ps1 script'
        required: false
        type: string
        default: 'build/scripts/Generate-NuGets-DotNet.ps1'
      helpers-path:
        description: 'Path to the Helpers.ps1 file. Defaults to Helpers.ps1 in the same directory as the script.'
        required: false
        type: string
        default: 'build/scripts/Helpers.ps1'
      publish-enabled:
        description: 'Publish to Nuget.org'
        required: false
        type: boolean
        default: true
      enable-email-notifications:
        description: 'Enable email notifications on failure'
        required: false
        type: boolean
        default: true
      runner-os:
        description: 'GitHub runner OS (e.g., ubuntu-latest, windows-latest)'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      NUGET_UPLOAD_TOKEN:
        description: 'NuGet publish credential (NuGet API key or Azure Artifacts PAT)'
        required: true
      WAVE_SENDGRID_TOKEN:
        description: 'SendGrid API key for email notifications'
        required: false
      EVERGINE_EMAILREPORT_LIST:
        description: 'Email addresses to send failure notifications to'
        required: false
      EVERGINE_EMAIL:
        description: 'Sender email address for notifications' 
        required: false
jobs:
  check_xml:
    runs-on: ${{ inputs.runner-os }}
    outputs:
      xml_changed: ${{ steps.compare_hashes.outputs.xml_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract XML file name and location
        id: xml_vars
        shell: pwsh
        run: |
          $xmlPath = "${{ inputs.xml-path }}"
          $xmlFile = Split-Path $xmlPath -Leaf
          $xmlDir = Split-Path $xmlPath -Parent
          if ([string]::IsNullOrEmpty($xmlDir)) { $xmlDir = "." }
          $xmlFileTmp = "${xmlFile}_tmp"
          echo "xml_file=$xmlFile"    >> $env:GITHUB_OUTPUT
          echo "xml_dir=$xmlDir"      >> $env:GITHUB_OUTPUT
          echo "xml_file_tmp=$xmlFileTmp" >> $env:GITHUB_OUTPUT

      - name: Download latest XML definition
        uses: carlosperate/download-file-action@v1.0.3
        with:
          file-url: ${{ inputs.xml-url }}
          file-name: ${{ steps.xml_vars.outputs.xml_file_tmp }}
          location: ${{ steps.xml_vars.outputs.xml_dir }}

      - name: Normalize downloaded XML to CRLF
        shell: pwsh
        run: |
          $xmlTmpPath = Join-Path "${{ steps.xml_vars.outputs.xml_dir }}" "${{ steps.xml_vars.outputs.xml_file_tmp }}"
          if (Test-Path $xmlTmpPath) {
            $content = Get-Content $xmlTmpPath -Raw
            $content = $content -replace "(?<!\r)\n", "`r`n"
            Set-Content $xmlTmpPath -Value $content -NoNewline
            Write-Host "Normalized $xmlTmpPath to CRLF."
          } else {
            Write-Host "File not found: $xmlTmpPath"
          }

      - name: Compare XML hashes
        id: compare_hashes
        shell: pwsh
        run: |
          $hash_current = "${{ hashFiles(inputs.xml-path) }}"
          $hash_new = "${{ hashFiles(format('{0}/{1}', steps.xml_vars.outputs.xml_dir, steps.xml_vars.outputs.xml_file_tmp)) }}"
          $changed = $hash_current -ne $hash_new
          echo "xml_hash_current=$hash_current" >> $env:GITHUB_OUTPUT
          echo "xml_hash_new=$hash_new" >> $env:GITHUB_OUTPUT
          echo "xml_changed=$changed" >> $env:GITHUB_OUTPUT
          Write-Host "Current hash: $hash_current"
          Write-Host "New hash: $hash_new"
          Write-Host "XML changed: $changed"

  build_and_publish:
    needs: check_xml
    if: needs.check_xml.outputs.xml_changed == 'true'
    runs-on: ${{ inputs.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract XML file name and location
        id: xml_vars
        shell: pwsh
        run: |
          $xmlPath = "${{ inputs.xml-path }}"
          $xmlFile = Split-Path $xmlPath -Leaf
          $xmlDir = Split-Path $xmlPath -Parent
          echo "xml_file=$xmlFile" >> $env:GITHUB_ENV
          echo "xml_dir=$xmlDir" >> $env:GITHUB_ENV

      - name: Download latest XML definition
        uses: carlosperate/download-file-action@v1.0.3
        with:
          file-url: ${{ inputs.xml-url }}
          file-name: ${{ env.xml_file }}
          location: ${{ env.xml_dir }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup NuGet CLI
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: ${{ inputs.nuget-version }}

      - name: Generate bindings
        uses: EvergineTeam/Evergine.Bindings/.github/actions/binding-generate-bindings-dotnet@v1
        with:
          script-path: ${{ inputs.bindings-script-path }}
          generator-project: ${{ inputs.generator-project }}
          generator-name: ${{ inputs.generator-name }}
          target-framework: ${{ inputs.target-framework }}
          runtime-identifier: ${{ inputs.runtime-identifier }}
          build-verbosity: ${{ inputs.build-verbosity }}
          build-configuration: ${{ inputs.build-configuration }}
          restore-workloads: ${{ inputs.restore-workloads }}

      # A changed registry does not mean a changed API. Khronos reorders elements,
      # fixes typos and edits documentation without touching a single declaration,
      # and publishing a functionally identical package on the back of that is
      # noise for everyone consuming the feed. The generated code is the honest
      # signal: if it is byte-identical, nothing that matters moved.
      - name: Detect generated-code changes
        id: generated
        shell: pwsh
        run: |
          $xmlPath = "${{ inputs.xml-path }}".Replace('\', '/')
          # Everything dirty except the registry itself is generator output: the
          # registry was overwritten by the download step a moment ago.
          $dirty = @(git status --porcelain --untracked-files=all |
                     Where-Object { $_.Substring(3).Replace('\', '/') -ne $xmlPath })
          $changed = $dirty.Count -gt 0
          echo "generated_changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($changed) {
            Write-Host "Generated code changed in $($dirty.Count) file(s):"
            $dirty | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "The registry changed but the generated API did not. Nothing to publish."
          }

      # Committed after generation, not before, so the registry and the code
      # generated from it land in the same commit. Committing the XML first --
      # which is what this workflow used to do -- is why Vulkan.NET's checked-in
      # Generated/ sat four months behind its own vk.xml while every published
      # package was correct.
      - name: Commit XML and regenerated bindings
        uses: EvergineTeam/Evergine.Bindings/.github/actions/commit-and-push-or-pr-update@v1
        with:
          commit_message: >-
            Update ${{ inputs.generator-name }} registry${{
              steps.generated.outputs.generated_changed == 'true'
                && ' and regenerate bindings' || ' (no API change)' }}
          mode: auto
          labels: xml
          pr_branch_name: chore/update-xml-${{ inputs.generator-name }}
          pr_title: "Update XML for ${{ inputs.generator-name }}"
          pr_body: "Automated update of XML file for binding ${{ inputs.generator-name }}."

      - name: Generate NuGets
        if: steps.generated.outputs.generated_changed == 'true'
        uses: EvergineTeam/Evergine.Bindings/.github/actions/binding-generate-nugets-dotnet@v1
        with:
          script-path: ${{ inputs.nugets-script-path }}
          helpers-path: ${{ inputs.helpers-path }}
          projects: ${{ inputs.binding-project }}
          dependency-projects: ${{ inputs.dependency-projects }}
          output-folder: ${{ inputs.output-folder }}
          build-verbosity: ${{ inputs.build-verbosity }}
          build-configuration: ${{ inputs.build-configuration }}
          restore-workloads: ${{ inputs.restore-workloads }}
          version: ${{ inputs.version }}
          revision: ${{ inputs.revision }}
          include-symbols: ${{ inputs.include-symbols }}
          symbols-format: ${{ inputs.symbols-format }}

      - name: List generated NuGets
        if: steps.generated.outputs.generated_changed == 'true'
        run: |
          ls ${{ inputs.output-folder }}/*.nupkg

      - name: Publish NuGet
        if: ${{ success() && inputs.publish-enabled == true && steps.generated.outputs.generated_changed == 'true' }}
        uses: EvergineTeam/Evergine.Bindings/.github/actions/nuget-publish@v1
        with:
          packages-folder: ${{ inputs.output-folder }}
          source-url: ${{ inputs.nuget-source }}
          auth-token: ${{ secrets.NUGET_UPLOAD_TOKEN }}
          package-pattern: "**/*.nupkg"
          skip-duplicate: 'true'
          no-symbols: 'true'

      - name: Send failure notification
        if: ${{ failure() && inputs.enable-email-notifications == true }}
        uses: EvergineTeam/Evergine.Bindings/.github/actions/send-notification-email@v1
        with:
          sendgrid-token: ${{ secrets.WAVE_SENDGRID_TOKEN }}
          from-email: ${{ secrets.EVERGINE_EMAIL }}
          to-emails: ${{ secrets.EVERGINE_EMAILREPORT_LIST }}
          subject: Binding XML CD publish failed - ${{ github.repository }}
