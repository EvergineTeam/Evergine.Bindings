name: Binding Native Coherence (Reusable)

description: >
  Checks that every P/Invoke the managed binding declares exists in the native
  libraries the package ships, on every platform it ships them for.

  This is the failure a binding carrying native binaries cannot afford and that
  nothing else catches. P/Invoke binds late: a declaration naming a symbol the
  library does not export compiles cleanly, passes CI, packs, publishes, and
  throws EntryPointNotFoundException the first time a consumer calls it. The
  header and the libraries being one release apart is enough to cause it, and
  there is no build error anywhere along the way.

  A static check rather than a smoke test, deliberately. A smoke test calls the
  two or three functions someone thought to write down, on whichever platform CI
  happens to run. This compares every declaration against every shipped library
  from a single machine -- for Meshoptimizer.NET, 84 symbols across five
  platforms instead of a sample of one.

  It says nothing about whether a function behaves correctly. It says the call
  will bind, which is the half that fails in silence.

on:
  workflow_call:
    inputs:
      manifest:
        required: false
        type: string
        default: 'binding.yml'
      toolbox-ref:
        required: false
        type: string
        default: 'v1'
      runner-os:
        required: false
        type: string
        default: 'ubuntu-latest'
      checkout-submodules:
        description: >-
          Passed straight to actions/checkout. Needed when the manifest declares
          `exports`, because the freshness check compares each copied file against the
          submodule it came from and cannot tell fresh from stale without it.

          `true` is usually enough -- the exported definitions sit at the top level of
          each submodule, so recursing into their own submodules only adds clone time
          and more that can fail.
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

jobs:
  coherence:
    runs-on: ${{ inputs.runner-os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Fetch the checker from the toolbox
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .coherence
          # native_paths.py is imported by the two checkers rather than run: it decides
          # where the libraries are and resolves an Apple framework to the binary inside
          # it. One module rather than a copy in each, because that logic is exactly the
          # kind that gets fixed in one place and left broken in the other.
          for tool in check-native-coherence.py dump-exports.py check-exports-fresh.py \
                      check-native-arch.py check-native-page-size.py native_paths.py; do
            gh api "repos/EvergineTeam/Evergine.Bindings/contents/tools/$tool?ref=${{ inputs.toolbox-ref }}" \
              -H 'Accept: application/vnd.github.raw' > ".coherence/$tool"
          done
          # Reading PE, ELF and Mach-O directly rather than shelling out to nm or
          # dumpbin: those are not on every runner, and their prose has to be
          # scraped, which reported a DLL's own name as an exported symbol.
          python -m pip install --quiet pefile pyelftools macholib pyyaml

      # Before the symbol check, because it is cheaper and because a stale copy makes
      # the symbol check's answer meaningless: it would compare declarations generated
      # from one revision against a library built from another.
      - name: Check the exported definitions are fresh
        shell: bash
        run: python .coherence/check-exports-fresh.py "${{ inputs.manifest }}"

      # A dimension the symbol check cannot see. Every symbol can be present in a
      # library built for the wrong machine, so that check reports success while .NET,
      # which picks by RID, loads nothing at all. ImGui.Net shipped an arm64 dylib
      # under runtimes/osx-x64 for as long as anyone can tell.
      - name: Check each library matches the architecture its RID promises
        shell: bash
        run: python .coherence/check-native-arch.py "${{ inputs.manifest }}"

      # Its neighbour above reads the machine field; this one reads the program headers of
      # the same file. A 64-bit Android library whose LOAD segments align to 4 KB links,
      # loads, and passes every check here -- including the smoke test, whose runner has
      # 4 KB pages. What it cannot do is be published: Google Play refuses such updates
      # from 1 February 2027, and the rejection lands on whoever ships an application built
      # on this package, months after the build that caused it went green.
      #
      # CesiumC shipped exactly that for as long as it had shipped Android. Nothing asked
      # for 4 KB -- the runner's NDK was r27c and the flag was absent, so the default
      # decided it and nothing looked.
      - name: Check Android libraries tolerate 16 KB pages
        shell: bash
        run: python .coherence/check-native-page-size.py "${{ inputs.manifest }}"

      - name: Check every declaration resolves
        shell: bash
        run: python .coherence/check-native-coherence.py "${{ inputs.manifest }}"
