name: Toolbox Updater (Reusable)

description: >
  Keeps a binding's installed agentic workflows pinned to the current toolbox
  release. Compares the `source:` recorded in the installed workflows against the
  latest tag, and when they differ reinstalls and recompiles, opening a pull
  request with the result.

  Deliberately not an agentic workflow. Comparing two versions, running
  `gh aw add --force` and recompiling is entirely deterministic -- there is
  nothing here for a model to decide, and paying inference for it would be waste.

  Moving the `v1` tag does not update anything on its own: a repository keeps the
  commit it was compiled against until something recompiles it. This is that
  something.

on:
  workflow_call:
    inputs:
      toolbox:
        description: 'Toolbox package to track'
        required: false
        type: string
        default: 'EvergineTeam/Evergine.Bindings'
      ref:
        description: 'Toolbox ref to install (the moving major tag by default)'
        required: false
        type: string
        default: 'v1'
      app-client-id:
        description: 'Client ID of the GitHub App that owns the push'
        required: true
        type: string
      runner-os:
        description: 'GitHub runner OS'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          Private key of the GitHub App that owns the push. GITHUB_TOKEN cannot
          write under .github/workflows/ -- that permission is App-only -- so
          without this the push is rejected.
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ${{ inputs.runner-os }}
    steps:
      # An installation token rather than a PAT: it is owned by the organisation
      # rather than by a person, expires in an hour, and does not need renewing
      # every year.
      - name: Mint an App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw

      - name: Compare installed pin against the current release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every installed workflow records where it came from, and `gh aw add`
          # installs them together, so they agree. Collect the distinct values
          # rather than trusting that: `grep -m1` counts per file, not overall, so
          # reading two installed workflows produced two lines, and assigning that
          # to a step output failed with "Invalid format" while the comparison
          # against a single SHA could never match -- reporting a repository as
          # outdated forever, including when it was current.
          shas=$(grep -h '^source:' .github/workflows/*.md 2>/dev/null \
                 | sed 's/.*@//' | sort -u || true)
          if [ -z "$shas" ]; then
            echo "No agentic workflows installed; nothing to update."
            echo "outdated=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(printf '%s\n' "$shas" | wc -l)" -gt 1 ]; then
            # A half-updated repository. Reinstalling brings them back in step,
            # so say so and carry on rather than stopping.
            echo "::warning::installed workflows disagree on their source:"
            printf '  %s\n' $shas
          fi
          installed=$(printf '%s\n' "$shas" | head -n1)
          latest=$(gh api "repos/${{ inputs.toolbox }}/commits/${{ inputs.ref }}" --jq .sha)
          echo "toolbox installed: $installed"
          echo "toolbox latest:    $latest"
          toolbox_moved=false
          [ "$installed" = "$latest" ] || toolbox_moved=true

          # Second, independent axis of drift: the gh-aw compiler.
          #
          # A repository keeps the compiler it was last compiled with, recorded in the
          # `# gh-aw-metadata:` line at the top of every lock file. Nothing recompiles it
          # when gh-aw ships a fix, and nothing fails in the meantime -- which is how the
          # whole fleet sat on v0.85.4 for three weeks while gh-aw fixed the Copilot CLI
          # toolcache bug that killed five Binding Updater runs on 1 September. This job
          # ran on schedule four times in that window and reported "already current" every
          # time, because until now it only ever looked at the toolbox SHA.
          #
          # `|| true` because a lock file whose first line does not carry the metadata --
          # an upstream schema change, a hand-edited file -- makes grep exit 1, and under
          # `pipefail` that would take the whole step down. Losing the check is bad; losing
          # the job that performs it is worse.
          locks=$(find .github/workflows -maxdepth 1 -name '*.lock.yml' | wc -l)
          compilers=$(for f in .github/workflows/*.lock.yml; do
                        [ -e "$f" ] || continue
                        head -n1 "$f" | grep -oE '"compiler_version":"[^"]*"' | cut -d'"' -f4 || true
                      done | sort -u)
          # Ask the CLI that will do the compiling rather than the release feed. They agree
          # today, because `Install gh-aw` takes the latest release, but the answer that
          # matters is what `gh aw compile` will stamp into the locks.
          current=$(gh aw version 2>/dev/null | grep -oE 'v?[0-9]+[.][0-9]+[.][0-9]+' | head -n1 || true)
          if [ -z "$current" ]; then
            echo "::warning::no version found in 'gh aw version' output; using the release feed"
            current=$(gh release view --repo github/gh-aw --json tagName --jq .tagName)
          fi
          current="v${current#v}"
          compiler_moved=false
          for c in $compilers; do
            [ "v${c#v}" = "$current" ] || compiler_moved=true
          done
          # Locks present but none readable: recompile rather than assume. Reading nothing
          # and concluding "current" is exactly the silence this check exists to break.
          if [ "$locks" -gt 0 ] && [ -z "$compilers" ]; then
            echo "::warning::no compiler_version found in any lock file; recompiling to be safe"
            compiler_moved=true
          fi
          installed_compiler=$(printf '%s ' $compilers | sed 's/ $//')
          echo "compiler installed: ${installed_compiler:-none}"
          echo "compiler latest:    $current"

          if [ "$toolbox_moved" = true ] && [ "$compiler_moved" = true ]; then
            reason=both
          elif [ "$toolbox_moved" = true ]; then
            reason=toolbox
          elif [ "$compiler_moved" = true ]; then
            reason=compiler
          else
            reason=none
          fi

          # A PR that moves no toolbox SHA must not say it repinned one.
          if [ "$reason" = compiler ]; then
            title="chore: recompile agents against gh-aw $current"
          else
            title="chore: update agents to the current toolbox release"
          fi

          {
            echo "reason=$reason"
            echo "title=$title"
            echo "installed_sha=$installed"
            echo "latest_sha=$latest"
            echo "installed_compiler=${installed_compiler:-unknown}"
            echo "latest_compiler=$current"
          } >> "$GITHUB_OUTPUT"

          if [ "$reason" = none ]; then
            echo "Already on the current release, compiled by the current gh-aw."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Recompiling: $reason drift."
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reinstall and recompile
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reinstalled even when only the compiler drifted, where it repins the toolbox to
          # the SHA it already had. That is a no-op on the tree and it keeps one code path
          # instead of two; `gh aw compile` below is what the compiler case is here for.
          gh aw add "${{ inputs.toolbox }}@${{ inputs.ref }}" --force

          # `gh aw add` regenerates the authoring scaffolding that binding repositories
          # deliberately do not carry: workflows are written in the toolbox and only
          # consumed here. Remove it again.
          #
          # Named files, not `rm -rf .github/agents`. That blanket delete would have taken
          # JoltPhysicsC's own cpp-to-c-binding.agent.md with it -- twelve kilobytes of
          # conventions the repository owns, sitting in a directory the installer also
          # writes to. It had never mattered because no repository had put anything of its
          # own there yet, and it would have gone quietly the first week one did.
          rm -rf .vscode .github/skills .github/mcp.json \
                 .github/workflows/copilot-setup-steps.yml .github/aw/logs
          rm -f .github/agents/agentic-workflows.md
          # Only if the installer's file was the only thing in it.
          rmdir .github/agents 2>/dev/null || true

          gh aw compile --strict

      - name: Open a pull request
        if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: chore/toolbox-update
          delete-branch: true
          title: ${{ steps.check.outputs.title }}
          commit-message: |
            ${{ steps.check.outputs.title }}

            Toolbox ${{ steps.check.outputs.installed_sha }} -> ${{ steps.check.outputs.latest_sha }}
            Compiler ${{ steps.check.outputs.installed_compiler }} -> ${{ steps.check.outputs.latest_compiler }}
            Drift: ${{ steps.check.outputs.reason }}
          labels: agent:toolbox-update
          body: |
            Brings the installed agentic workflows back in step with the current
            `${{ inputs.ref }}` of [`${{ inputs.toolbox }}`](https://github.com/${{ inputs.toolbox }})
            and the current gh-aw compiler.

            | | Installed | Current |
            |---|---|---|
            | Toolbox | `${{ steps.check.outputs.installed_sha }}` | `${{ steps.check.outputs.latest_sha }}` |
            | Compiler | `${{ steps.check.outputs.installed_compiler }}` | `${{ steps.check.outputs.latest_compiler }}` |

            What drifted: **${{ steps.check.outputs.reason }}**. A row whose two
            columns match did not move and is shown so the other one can be read
            against it.

            Neither moving the toolbox tag nor gh-aw cutting a release updates
            anything on its own — a repository keeps the commit and the compiler it
            was built against until something recompiles it, and nothing fails in
            the meantime. That is what makes the drift easy to accumulate and
            invisible without looking, and it is why compiler drift is checked at
            all: the fleet sat on gh-aw v0.85.4 for three weeks past a fix it
            needed, while this job reported everything current.

            Review the diff as you would any workflow change: the compiled
            `.lock.yml` files are generated, but the `.md` frontmatter is not.
