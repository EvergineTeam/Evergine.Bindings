name: 'Publish NuGet Packages'
description: 'Publishes NuGet packages to NuGet.org or Azure Artifacts with feed-specific authentication.'
author: 'Evergine Team'

inputs:
  packages-folder:
    description: 'Folder containing packages to publish'
    required: false
    default: 'nupkgs'
  source-url:
    description: 'NuGet feed source URL'
    required: false
    default: 'https://api.nuget.org/v3/index.json'
  auth-token:
    description: 'Token used for publishing (NuGet API key or Azure Artifacts PAT)'
    required: true
  package-pattern:
    description: 'Glob pattern for packages to publish'
    required: false
    default: '**/*.nupkg'
  skip-duplicate:
    description: 'Skip packages that already exist in the feed'
    required: false
    default: 'true'
  no-symbols:
    description: 'Do not publish symbols packages'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Publish packages
      shell: pwsh
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
      run: |
        $ErrorActionPreference = 'Stop'

        $packagesFolder = "${{ inputs.packages-folder }}"
        $sourceUrl = "${{ inputs.source-url }}"
        $authToken = "$env:AUTH_TOKEN"
        $packagePattern = "${{ inputs.package-pattern }}"
        $skipDuplicate = [System.Convert]::ToBoolean("${{ inputs.skip-duplicate }}")
        $noSymbols = [System.Convert]::ToBoolean("${{ inputs.no-symbols }}")

        if (-not (Test-Path $packagesFolder)) {
          Write-Error "Packages folder not found: $packagesFolder"
          exit 1
        }

        if ([string]::IsNullOrWhiteSpace($authToken)) {
          Write-Error "Input 'auth-token' is required and cannot be empty."
          exit 1
        }

        # One resolution, used for both the check and the push. It used to be two: this line
        # listed *.nupkg with the pattern hardcoded, and the push below was handed
        # Join-Path $packagesFolder $packagePattern instead -- so the guard confirmed that
        # packages existed and then something else was uploaded. It happened to agree, because
        # NuGet expands the glob it is given, but a guard that validates a different list from
        # the one it guards cannot catch the mismatch it is there for.
        # Callers pass "**/*.nupkg". -Filter is the Win32 FindFirstFile matcher: it understands
        # * and ? inside a single name component and has no idea what ** or a path separator
        # mean, so the globstar has to be stripped rather than passed through. -Recurse is what
        # ** was asking for anyway.
        $filter = $packagePattern -replace '^\*\*[\\/]', ''
        if ($filter -match '[\\/]') {
          Write-Error "package-pattern must be a file name pattern, optionally prefixed with '**/': got '$packagePattern'"
          exit 1
        }

        $packages = @(Get-ChildItem -Path $packagesFolder -Filter $filter -Recurse -File)
        if ($packages.Count -eq 0) {
          Write-Error "No package matching '$packagePattern' found under: $packagesFolder"
          exit 1
        }

        Write-Host "Publishing $($packages.Count) package(s) from ${packagesFolder}:"
        $packages | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) bytes" }

        $isAzureArtifacts = $sourceUrl -match 'dev\.azure\.com|visualstudio\.com'

        # The resolved paths, not a pattern. NuGet never has to guess what was meant, and the
        # log names exactly what went up.
        $pushArgs = @("nuget", "push") + ($packages | ForEach-Object { $_.FullName })

        if ($skipDuplicate) { $pushArgs += "--skip-duplicate" }
        if ($noSymbols)     { $pushArgs += "--no-symbols" }

        if ($isAzureArtifacts) {
          # Register the feed under a controlled, valid name in a temp nuget.config so we never
          # touch the repo's own nuget.config (which may have source names with spaces that would
          # cause 'dotnet nuget auth' to fail). --store-password-in-clear-text is required on
          # Linux agents where no OS credential store is available.
          $sourceName = "evergine-azure-artifacts-publish"
          $tempConfig = Join-Path ([System.IO.Path]::GetTempPath()) "nuget-publish-$([System.Guid]::NewGuid()).config"

          # dotnet nuget add source --configfile requires the file to already exist
          '<?xml version="1.0" encoding="utf-8"?><configuration></configuration>' | Set-Content $tempConfig -Encoding utf8

          try {
            dotnet nuget add source $sourceUrl `
              --name $sourceName `
              --username "github-actions" `
              --password $authToken `
              --store-password-in-clear-text `
              --configfile $tempConfig
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $pushArgs += @("--source", $sourceName, "--api-key", "AzureArtifacts", "--configfile", $tempConfig)
            dotnet @pushArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $tempConfig -Force -ErrorAction SilentlyContinue
          }
        } else {
          $pushArgs += @("--source", $sourceUrl, "--api-key", $authToken)
          dotnet @pushArgs
          # The Azure branch above has checked this since it was written and this one never did,
          # so a failed push to nuget.org depended on the exit code propagating out of pwsh on
          # its own. $ErrorActionPreference = 'Stop' does not cover it: that governs PowerShell
          # cmdlet errors, not the exit codes of native executables. Publishing is the one step
          # where reporting success without having done anything is worst.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
