name: "Fetch binding upstream"
description: >
  Reads binding.yml, fetches the declared upstream sources using the adapter named by
  upstream.kind, and reports whether anything changed. Deterministic on purpose: deciding
  whether a file differs is a byte comparison, not a reasoning task, and doing it here
  keeps it out of the agent's turn count.

inputs:
  manifest:
    description: "Path to the binding manifest"
    required: false
    default: "binding.yml"
  report-path:
    description: "Where to write the human-readable report the agent reads"
    required: false
    default: "/tmp/gh-aw/agent/upstream-report.md"
  github-token:
    description: "Token used to read upstream repositories for the git-tree adapter"
    required: false
    default: ${{ github.token }}
  resolve-only:
    description: >-
      Resolve the tracked release and report, without fetching anything or
      touching the working tree. A binding that ships native binaries has to
      know which revision it is heading for before it can decide whether to
      spend a multi-platform build on it.
    required: false
    default: "false"
  at-recorded-release:
    description: >-
      Fetch at the release `release.current` names instead of the newest one. Turns this
      into a drift check: anything that differs is a difference between the tree and the
      revision it declares, not upstream having moved on.

      Those are separate questions and only this one belongs in CI. A newer release is
      news; a tree that does not match its own recorded release is a defect, and it is the
      defect that reaches consumers. JoltPhysics.NET vendored headers from `main` while
      recording v5.5.0, so CI regenerated from one revision and the CD fetched another --
      and the first CD after release tracking committed code that did not compile.
    required: false
    default: "false"
  bump:
    description: >-
      Override `upstream.bump` for this call. Empty means obey the manifest.

      The agentic binding-updater passes `report-only`. gh-aw checks the repository out
      with `submodules: false` and that is not configurable from a workflow's `steps:`,
      so a manifest declaring `bump: together` would send the adapter down the mutating
      path with nothing to mutate: git then resolves the parent repository from the
      submodule's empty directory and fails on "upload-pack: not our ref". Every
      deterministic caller clones submodules first and leaves this empty.
    required: false
    default: ""

outputs:
  changed:
    description: "true when at least one source differs from the vendored copy"
    value: ${{ steps.fetch.outputs.changed }}
  report:
    description: "Path to the written report"
    value: ${{ steps.fetch.outputs.report }}
  paths:
    description: >-
      Newline-separated vendored paths declared in the manifest. The caller needs
      these to tell fetched sources apart from generator output when deciding
      what changed, and taking them from here avoids re-parsing YAML in a shell.
    value: ${{ steps.fetch.outputs.paths }}
  resolved_ref:
    description: "Upstream revision this binding should be on, once release tracking is applied"
    value: ${{ steps.fetch.outputs.resolved_ref }}
  previous_ref:
    description: "Revision recorded as vendored before this run"
    value: ${{ steps.fetch.outputs.previous_ref }}
  ref_moved:
    description: "true when the tracked release differs from the vendored one"
    value: ${{ steps.fetch.outputs.ref_moved }}
  submodule_heads:
    description: >-
      JSON object of submodule path to upstream head SHA, for kind: git-submodule in
      resolve-only mode. Whoever builds native binaries needs it to compile the same
      revision the run will commit: checking out the recorded pointers gives the old
      ones, since the bump happens later, and the libraries then belong to the revision
      being replaced.
    value: ${{ steps.fetch.outputs.submodule_heads }}
  natives_from_release:
    description: >-
      true when the manifest declared `upstream.assets` and they were unpacked in this
      run. The tracked CD refuses to commit a source bump for a package that ships native
      binaries unless somebody handed the binaries over; it knew only one way of doing
      that, artifacts from the same run, and would otherwise block the case where they
      come from a release of the repository the sources came from.
    value: ${{ steps.fetch.outputs.natives_from_release }}

runs:
  using: composite
  steps:
    - name: Fetch upstream sources
      id: fetch
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        REPORT_PATH: ${{ inputs.report-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        RESOLVE_ONLY: ${{ inputs.resolve-only }}
        AT_RECORDED_RELEASE: ${{ inputs.at-recorded-release }}
        BUMP_OVERRIDE: ${{ inputs.bump }}
      run: |
        set -euo pipefail
        # Windows runners ship `python`, not `python3`, and `pip` is not always on
        # PATH even when the interpreter is. This action ran only on ubuntu until
        # now, so neither had ever mattered.
        PY=$(command -v python3 || command -v python) || {
          echo "::error::no Python interpreter on PATH"; exit 1; }
        "$PY" -c "import yaml" 2>/dev/null || "$PY" -m pip install --quiet pyyaml
        mkdir -p "$(dirname "$REPORT_PATH")"
        "$PY" "$GITHUB_ACTION_PATH/fetch_upstream.py"
